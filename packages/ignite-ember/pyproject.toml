# igni's backend and CLI were published as ``ignite-ember`` until they were
# renamed ``igni-core``. This keeps the old name installable: each release of
# it is empty and depends on ``igni-core`` at the same version, with the same
# extras, so ``pip install 'ignite-ember[decisions]==X'`` installs igni-core X.
# Released with igni-core (release.yml); its version is igni-core's
# (scripts/sync-version.mjs).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ignite-ember"
version = "1.0.4"
description = "igni's backend and CLI, under its old name: installs igni-core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ignite Ember" }]
dependencies = ["igni-core==1.0.4"]

[project.optional-dependencies]
anthropic = ["igni-core[anthropic]==1.0.4"]
decisions = ["igni-core[decisions]==1.0.4"]
gemini = ["igni-core[gemini]==1.0.4"]
mcp = ["igni-core[mcp]==1.0.4"]
otel = ["igni-core[otel]==1.0.4"]
web = ["igni-core[web]==1.0.4"]

[project.urls]
Homepage = "https://ignite-ember.sh"
Repository = "https://github.com/ignite-ember/igni-core"

[tool.hatch.build.targets.wheel]
# Nothing of its own: the wheel is only metadata.
bypass-selection = true
