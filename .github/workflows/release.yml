name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. The jobs that write to the release say so
# themselves (`contents: write`), and the one job that mints provenance
# asks for `id-token` and `attestations` on its own.
permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check actor is repo admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::Releases can only be triggered by repo admins. Actor '${{ github.actor }}' has '$PERMISSION' permission."
            exit 1
          fi

  ci:
    needs: authorize
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release has two version universes and nothing used to make
      # them agree (igni-app's release checks the same for the desktop app). Tag-derived: latest.json's ``version`` field and the
      # ``pip install 'ignite-ember==…'`` line in the release body.
      # Commit-derived: pyproject.toml, which hatchling stamps onto the
      # wheel and sync-version.mjs copies into tauri.conf.json /
      # Cargo.toml (``CARGO_PKG_VERSION``, what the updater plugin
      # compares latest.json against). Tag ``v1.0.4`` on a tree still at
      # 1.0.3 shipped a release whose own page contradicted itself, and
      # an installed desktop app that stays "out of date" forever: the
      # updater downloads the bundle, the bundle reports 1.0.3, the
      # feed still says 1.0.4, so it offers the same update on every
      # launch. This is the first step of publish-pypi and every other
      # job needs it transitively, so the whole release stops here.
      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          TAG_V="${GITHUB_REF#refs/tags/v}"
          PY_V="$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG_V" != "$PY_V" ]; then
            echo "::error::tag v$TAG_V does not match pyproject.toml version $PY_V — bump pyproject (and run scripts/sync-version.mjs) or retag"
            exit 1
          fi
          echo "tag and pyproject agree on $PY_V"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      # Belt-and-suspenders: ``pyproject.toml`` is the SoT, but
      # ``src/ember_code/__init__.py``'s ``__version__`` lives outside
      # the build backend's reach. If a release goes out without the
      # author having run ``scripts/sync-version.mjs`` locally, this
      # step makes sure the published wheel exposes the right
      # ``__version__`` at import time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Sync __version__ with pyproject.toml
        run: node scripts/sync-version.mjs

      # …and then fail if it had anything to do: a committed
      # ``__version__`` that disagrees with pyproject.toml is a wheel that
      # reports the wrong version when imported from a checkout.
      - name: Fail if the committed client versions were out of sync
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::__version__ was not in sync with pyproject.toml — run 'node scripts/sync-version.mjs' and commit before tagging"
            git diff --stat
            exit 1
          fi

      - name: Build package
        run: uv build

      # The same bytes PyPI gets, for release-evidence: it attaches them to
      # the GitHub release (for installs that cannot reach PyPI), lists them
      # in SHA256SUMS and attests their provenance.
      - name: Keep the wheel and sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # With trusted publishing this also uploads PEP 740 attestations to
      # PyPI (the action's default), so `pypi.org` shows where each file
      # was built.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # The draft release every later job attaches to, by its ID: a draft
  # cannot be looked up by its tag, and two jobs creating the release by
  # tag raced into duplicates. ``github-release`` publishes it at the end.
  prepare-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        id: create
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          # Pre-releases (rc/alpha/beta/dev tags) get the
          # "Pre-release" badge on the releases page so users don't
          # accidentally pick them up as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Leave body empty here — the ``github-release`` job at
          # the end of the workflow generates + sets the final body
          # once every artifact has landed.
          body: ""

  # SBOMs, checksums, provenance and (once the key exists) a signature,
  # for every file this release ships — before the draft is published, so
  # a release is never public without them. docs/VERIFYING_RELEASES.md is
  # the user's side of this job.
  #
  # One SHA256SUMS covers everything: the wheel, the sdist and the SBOM.
  # Provenance is minted for every line of it in one attestation, and the
  # cosign signature is over it too, so one signed file vouches for every
  # other — the shape of igni server's bundle MANIFEST.
  release-evidence:
    needs: [prepare-release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # read the draft's assets, attach the evidence
      id-token: write      # Sigstore certificate for the attestation
      attestations: write  # store it on this repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the wheel and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/python

      # By release ID, not tag: a draft cannot be looked up by its tag
      # (see github-release below). Evidence from an earlier attempt of this
      # job is skipped, so a re-run hashes the shipped files only.
      - name: Download what is already on the draft
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in
              SHA256SUMS|SHA256SUMS.sig|*.cdx.json|*.sigstore.json) continue ;;
            esac
            echo "  $name"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "dist/release/${name}"
          done
          cp dist/python/* dist/release/
          ls -la dist/release

      # ── SBOMs: one per kind of thing a user installs ─────────────────
      #
      # The wheel's from uv.lock, every extra but `dev` — what `pip install
      # 'ignite-ember[…]'` can bring in. Development dependencies are left
      # out: they do not ship. The desktop app is released, with its own
      # SBOM, from ignite-ember/igni-app.
      - name: SBOM — Python package
        run: |
          uv export --frozen --no-dev --all-extras --no-extra dev \
            --format cyclonedx1.5 --preview-features sbom-export \
            -o "dist/release/ignite-ember-${{ steps.v.outputs.version }}.cdx.json"

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          (cd dist/release && sha256sum -- *) > dist/evidence/SHA256SUMS
          cat dist/evidence/SHA256SUMS
          { echo "### ${TAG}"; echo; echo '```'; cat dist/evidence/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # SLSA build provenance for every file in SHA256SUMS, signed with a
      # short-lived Sigstore certificate bound to this workflow run and
      # recorded in Sigstore's public transparency log (this repository is
      # public; the log entry says nothing the repository does not).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/evidence/SHA256SUMS

      # The attestation also lives on GitHub (`gh attestation verify`
      # fetches it); attaching the bundle lets a machine with no network
      # verify it with `--bundle` and a trusted root.
      - name: Keep the attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/evidence/igni-${{ steps.v.outputs.version }}.provenance.sigstore.json"

      # ── Signature ────────────────────────────────────────────────────
      #
      # igni server's approach: a cosign key pair, not keyless, so a user
      # needs only the public key to verify, and `--tlog-upload=false`
      # keeps the signature out of the public log. igni server's offline
      # bundle signs its images, not anything this repository publishes, so
      # this is the only signature on these files.
      #
      # The key ceremony has not happened. Until COSIGN_PRIVATE_KEY,
      # COSIGN_PASSWORD (secrets) and COSIGN_PUBLIC_KEY (variable) are all
      # set, the release goes out unsigned and says so; with only some of
      # them set it fails, because that is a mistake rather than a state.
      - name: Is there a signing key?
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${COSIGN_PRIVATE_KEY}" ] || missing+=("secret COSIGN_PRIVATE_KEY")
          [ -n "${COSIGN_PASSWORD}" ] || missing+=("secret COSIGN_PASSWORD")
          [ -n "${COSIGN_PUBLIC_KEY}" ] || missing+=("variable COSIGN_PUBLIC_KEY")
          if [ "${#missing[@]}" -eq 3 ]; then
            echo "::notice title=Unsigned release::No cosign key is configured (the key ceremony has not happened); SHA256SUMS is not signed. Provenance and SBOMs are still attached."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::cosign is half-configured; missing: ${missing[*]}"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: steps.key.outputs.present == 'true'
        with:
          cosign-release: v2.4.1

      - name: Sign SHA256SUMS
        if: steps.key.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature dist/evidence/SHA256SUMS.sig dist/evidence/SHA256SUMS
          printf '%s\n' "${COSIGN_PUBLIC_KEY}" > "${RUNNER_TEMP}/cosign.pub"
          cosign verify-blob --key "${RUNNER_TEMP}/cosign.pub" --insecure-ignore-tlog=true \
            --signature dist/evidence/SHA256SUMS.sig dist/evidence/SHA256SUMS

      # Only what this job adds.
      - name: Attach to the draft release
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/python/* dist/release/*.cdx.json dist/evidence/*

  github-release:
    needs: [prepare-release, publish-pypi, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Tag is ``v0.6.0`` / ``v0.6.0-rc.1`` etc. ``pip_version``
          # is the PyPI-installable form (no leading ``v``); previous
          # body used ``${{ github.ref_name }}`` directly, which gave
          # the broken ``pip install ignite-ember==v0.6.0-rc.1`` snippet
          # (pip rejects the ``v`` prefix).
          PIP_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "pip_version=$PIP_VERSION" >> "$GITHUB_OUTPUT"

          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG".."$TAG" -- | head -50)
            # Write multiline output
            {
              echo "body<<RELEASE_EOF"
              echo "$NOTES"
              echo "RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # We target the draft release ``prepare-release`` created at
      # the start of this workflow run, by its explicit ID — NOT by
      # tag. Using ``softprops/action-gh-release`` here used to
      # race with the draft's eventual-consistency lookup, creating
      # a second (empty, published) release with the same tag and
      # then failing to ``finalize`` the original because GitHub
      # rejects ``tag_name`` collisions on PATCH. Using ``gh
      # release`` CLI with the ID we already know avoids the
      # lookup entirely.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Every asset is already on the draft: the wheel, sdist and
          # evidence from release-evidence.

          # Compose the final body + publish (draft → false). We use
          # the API directly because ``gh release edit`` can't take
          # a release ID; it uses tag, which is fine here since we
          # only have ONE release for this tag (the duplicate-race
          # bug was specific to softprops).
          BODY=$(cat <<'BODY_EOF'
          ${{ steps.notes.outputs.body }}

          ## Install

          **Python (CLI / library):**
          ```bash
          pip install 'ignite-ember[decisions]==${{ steps.notes.outputs.pip_version }}'
          # or
          uv pip install 'ignite-ember[decisions]==${{ steps.notes.outputs.pip_version }}'
          # ``[decisions]`` adds igni's decisions service (Laya, torch) for
          # Bypass mode's last check and ``host.decide``; leave it out on a
          # backend that points IGNI_DECISIONS_URL at a shared one.
          ```

          **Desktop app:** released from
          [ignite-ember/igni-app](https://github.com/ignite-ember/igni-app/releases)
          under the same version, which installs this backend on first launch.

          ## Verify

          ``SHA256SUMS`` lists every file on this release. Each one has
          GitHub build provenance (``gh attestation verify <file> --repo
          ${{ github.repository }}``; the bundle is attached for offline
          checks), the ``*.cdx.json`` files are CycloneDX SBOMs, and
          ``SHA256SUMS.sig``, when present, is a cosign signature over the
          checksums. See docs/VERIFYING_RELEASES.md.
          BODY_EOF
          )

          PRERELEASE=${{ contains(github.ref_name, '-') }}
          gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -f name="${{ github.ref_name }}" \
            -f body="$BODY" \
            -F draft=false \
            -F prerelease=$PRERELEASE \
            --jq '{id, name, draft, prerelease, html_url}'

  update-homebrew:
    needs: publish-pypi
    # Skip on RC / alpha / beta / dev tags. The brew formula
    # tracks the latest STABLE release; pre-release tags don't
    # actually publish a new PyPI sdist (the version in
    # ``pyproject.toml`` is the SoT, ``skip-existing: true`` silently
    # no-ops the publish on RC tags). The homebrew job would 404 on
    # the non-existent ``ignite_ember-X.Y.Zrc1.tar.gz`` file. Run
    # only on tags WITHOUT a hyphen (i.e. ``v1.2.3`` not
    # ``v1.2.3-rc.1``).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PyPI propagation
        run: sleep 30

      - name: Get tag version
        id: version
        # ``version``  is the raw tag (used for the Brew formula's
        # ``ignite-ember==X`` pin — pip normalises during install so
        # both forms work). ``pypi_version`` is the PEP-440-normalised
        # form used in the PyPI sdist URL: ``files.pythonhosted.org``
        # serves files under the normalised name, so ``0.6.0-rc.1``
        # has to become ``0.6.0rc1`` to resolve.
        run: |
          RAW="${GITHUB_REF#refs/tags/v}"
          NORM=$(python3 -c "
          import re, sys
          v = sys.argv[1]
          # PEP 440 pre/post/dev: collapse the separator + lowercase the kind.
          v = re.sub(r'[-_.]?(alpha|a)[-_.]?(\d+)', r'a\2', v, flags=re.I)
          v = re.sub(r'[-_.]?(beta|b)[-_.]?(\d+)', r'b\2', v, flags=re.I)
          v = re.sub(r'[-_.]?(rc|c|pre|preview)[-_.]?(\d+)', r'rc\2', v, flags=re.I)
          v = re.sub(r'[-_.]?(post|rev|r)[-_.]?(\d+)', r'.post\2', v, flags=re.I)
          v = re.sub(r'[-_.]?dev[-_.]?(\d+)', r'.dev\1', v, flags=re.I)
          print(v)
          " "$RAW")
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "pypi_version=$NORM" >> "$GITHUB_OUTPUT"
          echo "raw=$RAW pypi=$NORM"

      - name: Wait for PyPI CDN to propagate
        # ``publish-pypi`` completes the moment Warehouse accepts the
        # upload, but the ``files.pythonhosted.org`` CDN needs 1–5
        # minutes to expose the sdist. Polling the JSON index is
        # cheap and gives an unambiguous signal (returns 200 as soon
        # as the version's release row is queryable), so we gate the
        # download step on that instead of blindly retrying curl.
        run: |
          VERSION="${{ steps.version.outputs.pypi_version }}"
          URL="https://pypi.org/pypi/ignite-ember/${VERSION}/json"
          for i in $(seq 1 20); do
            if curl -fsSL -o /dev/null "$URL"; then
              echo "pypi visible after $((i*30 - 30))s"
              exit 0
            fi
            echo "  attempt $i/20 — not yet, waiting 30s"
            sleep 30
          done
          echo "::error::PyPI JSON index never returned 200 for ignite-ember==$VERSION after 10 minutes"
          exit 1

      - name: Download sdist and compute SHA
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.pypi_version }}"
          URL="https://files.pythonhosted.org/packages/source/i/ignite-ember/ignite_ember-${VERSION}.tar.gz"
          # JSON index is up (previous step gated on that), but the
          # sdist file itself can lag a beat longer on the CDN. Keep
          # a shorter retry loop here as a safety net rather than the
          # sole propagation gate.
          for i in $(seq 1 10); do
            if curl -fsSL -o sdist.tar.gz "$URL"; then
              SHA=$(sha256sum sdist.tar.gz | awk '{print $1}')
              echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  attempt $i/10 — sdist not yet on CDN, waiting 30s"
            sleep 30
          done
          echo "::error::sdist file never appeared on files.pythonhosted.org after 5 minutes"
          exit 1

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ignite-ember/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          # Simple formula: create venv, pip install from PyPI (uses wheels)
          # NOTE: Homebrew derives the class name from the formula file
          # via ``Formula.class_s``: ``ignite-ember`` → ``IgniteEmber``
          # (PascalCase, hyphens dropped). A lowercase leading letter
          # makes it invalid Ruby and Homebrew silently refuses to load
          # the formula — the reason releases v0.7.0 through v0.8.3
          # never propagated to ``brew upgrade`` users.
          cat > Formula/ignite-ember.rb << 'FORMULA'
          class IgniteEmber < Formula
            include Language::Python::Virtualenv

            desc "AI coding assistant with multi-agent orchestration"
            homepage "https://ignite-ember.sh"
            url "PLACEHOLDER_URL"
            sha256 "PLACEHOLDER_SHA"
            # Apache-2.0, matching ``LICENSE`` at the repo root and
            # ``license = "Apache-2.0"`` in pyproject.toml. This said
            # "MIT" for every release published so far, which put a
            # licence the project has never shipped under on the tap
            # page brew users read before installing. Homebrew validates
            # this string against its SPDX list, so keep it SPDX-exact.
            license "Apache-2.0"

            depends_on "git"
            depends_on "python@3.12"
            depends_on "ripgrep"

            skip_clean "libexec"

            def install
              venv = virtualenv_create(libexec, "python3.12")
              system libexec/"bin/python3.12", "-m", "pip", "install", "--prefer-binary", "ignite-ember==PLACEHOLDER_VERSION"
              # Both console scripts from pyproject's [project.scripts].
              # ``igni`` is the canonical command and the one README and
              # QUICKSTART tell brew users to type; for every release up
              # to now only ``ignite-ember`` was linked, so the
              # documented install path shipped without the documented
              # command. The test below runs ``igni`` for that reason —
              # dropping this line again fails the formula's own test.
              bin.install_symlink libexec/"bin/ignite-ember"
              bin.install_symlink libexec/"bin/igni"

              # Clear dylib IDs from Rust-built Python extensions so Homebrew's
              # install_name_tool fixup doesn't fail on them.
              Dir.glob(libexec/"lib/**/*.so").each do |so|
                MachO::Tools.change_dylib_id(so, "") rescue nil
              end
            end

            test do
              # Run the canonical name first: ``brew test`` is the only
              # thing that would have caught the missing symlink, and it
              # was pointed at the other binary.
              assert_match "igni", shell_output("#{bin}/igni --version")
              assert_match "igni", shell_output("#{bin}/ignite-ember --version")
            end
          end
          FORMULA

          # Fix heredoc indentation and replace placeholders
          sed -i 's/^          //' Formula/ignite-ember.rb
          PYPI_VERSION="${{ steps.version.outputs.pypi_version }}"
          sed -i "s|PLACEHOLDER_URL|https://files.pythonhosted.org/packages/source/i/ignite-ember/ignite_ember-${PYPI_VERSION}.tar.gz|" Formula/ignite-ember.rb
          sed -i "s|PLACEHOLDER_SHA|${SHA}|" Formula/ignite-ember.rb
          sed -i "s|PLACEHOLDER_VERSION|${VERSION}|" Formula/ignite-ember.rb

          # Belt-and-suspenders: parse the generated Ruby before we
          # push it, so a future rebrand can't silently ship an
          # unparseable formula again. ``ruby -c`` returns non-zero on
          # any syntax error; combined with the class-name comment
          # above this catches both the specific past regression and
          # anything else that breaks parsing.
          if ! ruby -c Formula/ignite-ember.rb; then
            echo "::error::Generated Homebrew formula is not valid Ruby — aborting"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ignite-ember.rb
          # ``git commit`` fails with exit 1 when nothing is staged,
          # which would fail the job on a re-run of the same tag.
          # Skip cleanly instead — the tap is already up-to-date.
          if git diff --cached --quiet; then
            echo "Formula unchanged for ${VERSION}; nothing to push."
            exit 0
          fi
          git commit -m "Update ignite-ember to ${VERSION}"
          git push
