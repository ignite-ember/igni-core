name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Read-only. Nothing here writes to the repository; artifacts upload with
# the runner's own token. A workflow that calls this one (release.yml) can
# only narrow it, never widen it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Read from ``.python-version`` rather than written out here.
          # The version is one fact; every copy of it is a chance to
          # drift, and this file held two of them.
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install -e packages/igni-cloud

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/ packages/igni-cloud/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/ packages/igni-cloud/

      - name: Mypy
        run: |
          uv run --no-sync mypy src/ember_code/
          uv run --no-sync mypy packages/igni-cloud/src/igni_cloud/

  # No matrix. The product ships one interpreter, so there is one job,
  # and its name carries no version — which matters because the branch
  # ruleset requires check names. A matrix made the check ``test (3.11)``
  # and friends, so every version change silently required a ruleset
  # edit too; forgetting it blocked every pull request on a check that
  # could never report. That happened twice in one day.
  # Nothing audited dependencies here either. The first run found 101
  # advisories across 21 packages — 19 in gitpython, which this app uses to
  # run real git operations on a developer's checkout, and 20 in pillow.
  # All 101 cleared: most from `uv lock --upgrade`, the last 9 by relaxing
  # two of our own `~=` pins (`pypdf`, `mcp`) that were capping the fixes.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Read from ``.python-version`` rather than written out here.
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      # No ignores: this repo is clean, and it should stay a job that fails
      # on the first new advisory rather than one carrying an exception list.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit

  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, because one test in this suite is *about* the history.
      # ``actions/checkout`` fetches depth 1 by default, which leaves the merge
      # commit with no parents — and ``test_the_commit_convention_is_followed``
      # skips itself rather than draw conclusions from a window of one. It had
      # therefore never run anywhere it was enforced, which is the state that
      # test's own docstring calls worse than having no rule at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # igni-sdk and igni-app, beside this checkout (tests/siblings.py): the
      # tests that drive a real extension built with the SDK, read its
      # examples, or hold the web client and the desktop shell to what the
      # backend says run against them. Under CI they fail rather than skip
      # when a checkout is missing. Their main, as this repository's main
      # is: the three are developed in lockstep.
      - name: igni-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-sdk
          path: .siblings/igni-sdk
          persist-credentials: false

      - name: igni-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-app
          path: .siblings/igni-app
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      # The core alone — the desktop's wheel, without psycopg or the
      # cloud layer: everything it does must work, and every cloud test
      # lives in packages/igni-cloud. Plus the otel extra: its tests
      # (test_telemetry_goes_only_to_the_customers_collector.py) import
      # the exporters, and without them the module failed to collect.
      - name: Install dependencies
        run: uv sync --extra dev --extra otel

      # The tests `igni ext init --service` writes need both SDKs (from the
      # igni-sdk checkout), which igni's own environment does not carry; without an interpreter
      # that has them the test that runs them skipped here, so it never
      # ran anywhere (and under CI it now fails instead of skipping).
      - name: An interpreter with both SDKs, for the scaffold's tests
        run: |
          uv venv /tmp/igni-sdks
          uv pip install --python /tmp/igni-sdks/bin/python \
            ./.siblings/igni-sdk/packages/igni-extension ./.siblings/igni-sdk/packages/igni-service \
            pytest anyio httpx

      # Line and branch coverage over the core, with a floor: the total
      # when it was set (87.6%, T6, 2026-11-03), minus one point, so it can only
      # go up. Raise it as coverage rises; never lower it to let a change
      # through. ``--cov-report=`` keeps the per-file table out of the log;
      # the floor check still prints the total.
      - name: Run tests
        env:
          IGNI_SDK_PYTHON: /tmp/igni-sdks/bin/python
          IGNI_SDK_DIR: ${{ github.workspace }}/.siblings/igni-sdk
          IGNI_APP_DIR: ${{ github.workspace }}/.siblings/igni-app
        run: >-
          uv run pytest tests/ -q -rs
          --cov=ember_code --cov-branch --cov-report=
          --cov-fail-under=86.5

      - name: The cloud layer's tests
        run: |
          uv pip install -e packages/igni-cloud
          uv run --no-sync pytest packages/igni-cloud/tests -q -rs

  # The extension sandbox's real Linux path: bubblewrap with a network
  # namespace of its own, and bridge.py relaying the egress proxy into it
  # (tests/test_an_extension_process_is_confined_to_its_grants.py). On
  # the test job those tests skip — ubuntu-latest ships no bwrap, and
  # Ubuntu 24.04's AppArmor stops unprivileged user namespaces — so the
  # Linux half of the sandbox ran nowhere. Its own job so the main one
  # pays nothing for the apt install.
  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --extra dev --extra otel

      - name: Install bubblewrap and allow it user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc true

      # The Linux tests skip themselves where bwrap cannot run. Here it
      # can, so a skip naming bwrap or Linux is a failure: otherwise the
      # job would go green having run nothing it exists for.
      - name: Sandbox tests under real bubblewrap
        run: |
          uv run --no-sync pytest tests/test_an_extension_process_is_confined_to_its_grants.py \
            tests/test_the_sandbox_bridge_relays_loopback_ports_to_unix_sockets.py \
            -q -rs 2>&1 | tee sandbox.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "SKIPPED.*(bwrap|Linux)" sandbox.log; then
            echo "A Linux sandbox test skipped on a runner that has bwrap" >&2
            exit 1
          fi

  # igni's stores against PostgreSQL, the cloud's database (docs/CLOUD.md
  # section 9). The suite above runs them on SQLite; here the same tests
  # run again on a real server, which they skip — saying why — wherever
  # IGNI_TEST_DATABASE_URL is unset. Its own job rather than a matrix
  # entry for the reason the test job has no matrix: the check name is
  # what the branch ruleset requires.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      # PostgreSQL storage is the igni-cloud package's (an entry point,
      # found by the database URL), so it is installed here.
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install -e packages/igni-cloud

      - name: Storage tests on PostgreSQL
        env:
          IGNI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: >-
          uv run --no-sync pytest -q -rs
          tests/test_storage_backends.py
          tests/test_approvals_and_queued_messages_survive_a_restart.py
          tests/test_an_approval_resumes_after_a_cold_restart.py
          packages/igni-cloud/tests
