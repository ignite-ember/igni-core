name: Release readiness

# Runs the end-to-end onboarding smoke that exercises the exact path
# a new user takes: download uv → install Python → install
# igni-core → prefetch Laya → spawn the BE → confirm
# the ready line. ~2-3 min per platform.
#
# Why a separate workflow:
#   - It downloads ~150 MB and takes ~3 min — too slow for every PR.
#   - The thing that breaks here is rarely the FE code; it's PyPI
#     wheel availability, uv release-asset URLs, model-cache layout.
#     Those drift on their own schedule (PyPI maintenance, uv minor
#     bumps, HuggingFace outages), so a nightly + on-tag schedule
#     catches them BEFORE we cut a release.
#
# Triggers:
#   - Tag push (``v*``) — final gate before publishing.
#   - Nightly cron — surfaces upstream drift in a recognisable
#     window.
#   - Manual dispatch — for verifying a specific commit.

on:
  push:
    tags: ["v*"]
  schedule:
    # 06:00 UTC = ~11 PM PT the night before. Fast feedback for
    # any drift overnight.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "igni-core version to install (blank = read from pyproject.toml)"
        required: false
        default: ""
      use_local:
        description: "Install from the working tree instead of PyPI"
        type: boolean
        default: false

# Read-only: it installs, runs and uploads logs, and writes nothing back.
permissions:
  contents: read

jobs:
  # POSIX smoke — macOS + Linux. Bash script + tar.gz uv archive.
  smoke-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for PyPI CDN to propagate
        # On tag pushes, release-readiness runs almost immediately
        # after ``publish-pypi``, and the PyPI CDN (JSON index +
        # sdist file) needs 1–5 minutes to expose a fresh version.
        # Polling the JSON index is cheap and returns 200 as soon
        # as the release row is queryable — gate the smoke script
        # on that so ``uv pip install igni-core==X.Y.Z`` doesn't
        # race the propagation and fail unsatisfiable. Skipped when
        # ``use_local=true`` (manual dispatch with local sdist).
        # Only gate on PyPI when we're actually installing a freshly-
        # tagged version. On the nightly ``schedule`` run there's no
        # tag ref — the smoke script reads pyproject and installs
        # whatever's already published, so waiting would be a no-op
        # (or worse, wait for a bogus version derived from
        # ``refs/heads/main``).
        if: ${{ inputs.use_local != true && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: |
          # Derive the version being smoked. On tag push we use the
          # tag ref; the pyproject stays in lockstep via CI so
          # either source works, but the tag is authoritative.
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF##*/v}"
          fi
          URL="https://pypi.org/pypi/igni-core/${VERSION}/json"
          echo "waiting for $URL"
          for i in $(seq 1 20); do
            if curl -fsSL -o /dev/null "$URL"; then
              echo "pypi visible after $((i*30 - 30))s"
              exit 0
            fi
            echo "  attempt $i/20 — not yet, waiting 30s"
            sleep 30
          done
          echo "::error::PyPI never returned 200 for igni-core==$VERSION after 10 minutes"
          exit 1

      - name: Run onboarding smoke (POSIX)
        id: smoke
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          ARGS=()
          if [[ "${{ inputs.use_local }}" == "true" ]]; then
            ARGS+=(--local)
          fi
          if [[ -n "${{ inputs.version }}" ]]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi
          # The script exits 77 when the version is not on PyPI: there
          # is nothing published to smoke yet, which is not a failure.
          set +e
          ./scripts/onboarding-smoke.sh "${ARGS[@]}"
          code=$?
          set -e
          if [[ "$code" == "77" ]]; then
            echo "::notice::igni-core is not on PyPI at that version - the smoke had nothing to check."
            exit 0
          fi
          exit "$code"

      # The script writes ``log-dir=<abs path>`` to $GITHUB_OUTPUT before
      # it does anything that can fail, and keeps that directory when the
      # run fails. We upload exactly what it reported.
      #
      # This step used to glob ``/tmp/ember-onboarding-*/be-*.log`` and
      # could never match: the logs lived inside the script's temp cache,
      # which the EXIT trap deleted on the way out of a failing run, and
      # ``mktemp -t`` follows $TMPDIR, so on macOS the directory was under
      # /var/folders/... rather than /tmp regardless. Asking the script
      # where it wrote beats reconstructing the path per-platform.
      - name: Upload smoke logs on failure
        # The output is empty only if the script died before its first
        # few lines; guard so upload-artifact isn't handed a blank path.
        if: ${{ failure() && steps.smoke.outputs.log-dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-smoke-logs-${{ matrix.os }}
          path: ${{ steps.smoke.outputs.log-dir }}
          # ``warn`` not ``ignore``: an empty log dir on a failing run is
          # itself a finding (the backend produced no output at all), and
          # silently uploading nothing is how this went unnoticed before.
          if-no-files-found: warn
          retention-days: 7

  # Windows smoke — separate job because the shell, archive format,
  # and ``Start-Process`` flow are different enough that a single
  # script would be a mess of branches. ``onboarding-smoke.ps1``
  # mirrors the POSIX script step-by-step.
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for PyPI CDN to propagate
        # Windows equivalent of the smoke-posix wait step. Same
        # rationale — bash + curl equivalents rewritten in pwsh
        # because ``curl.exe`` isn't reliably on the default
        # Windows runner PATH and ``Invoke-WebRequest`` is native.
        # Only gate on PyPI when we're actually installing a freshly-
        # tagged version. On the nightly ``schedule`` run there's no
        # tag ref — the smoke script reads pyproject and installs
        # whatever's already published, so waiting would be a no-op
        # (or worse, wait for a bogus version derived from
        # ``refs/heads/main``).
        if: ${{ inputs.use_local != true && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        shell: pwsh
        run: |
          if ("${{ inputs.version }}") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "$env:GITHUB_REF" -replace '^refs/tags/v', ''
          }
          $url = "https://pypi.org/pypi/igni-core/$version/json"
          Write-Host "waiting for $url"
          for ($i = 1; $i -le 20; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -Method Head -TimeoutSec 15 -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "pypi visible after $((($i - 1) * 30))s"
                exit 0
              }
            } catch {
              Write-Host "  attempt $i/20 — not yet, waiting 30s"
              Start-Sleep -Seconds 30
            }
          }
          Write-Error "PyPI never returned 200 for igni-core==$version after 10 minutes"
          exit 1

      - name: Run onboarding smoke (Windows)
        id: smoke
        shell: pwsh
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          $args = @()
          if ("${{ inputs.use_local }}" -eq "true") { $args += "-Local" }
          if ("${{ inputs.version }}") { $args += "-Version"; $args += "${{ inputs.version }}" }
          # Exit 77 means the version is not on PyPI: there is nothing
          # published to smoke yet, which is not a failure.
          & ./scripts/onboarding-smoke.ps1 @args
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Host "::notice::igni-core is not on PyPI at that version - the smoke had nothing to check."
            exit 0
          }
          exit $code

      # Same contract as the POSIX leg: the .ps1 reports ``log-dir`` to
      # $GITHUB_OUTPUT up front and keeps that directory on failure.
      # The old glob was doubly wrong here — the logs were deleted by the
      # ``finally`` cleanup, and the script's temp root is
      # ``[System.IO.Path]::GetTempPath()`` (i.e. $env:TEMP), which is a
      # different directory from ``runner.temp`` on a Windows runner.
      - name: Upload smoke logs on failure
        if: ${{ failure() && steps.smoke.outputs.log-dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-smoke-logs-windows
          path: ${{ steps.smoke.outputs.log-dir }}
          if-no-files-found: warn
          retention-days: 7

  # The extension sandbox's real Windows path: an AppContainer per run,
  # a job object, and the named pipes winbridge.py relays the egress
  # proxy and igni's endpoints through
  # (tests/test_an_extension_process_is_confined_on_windows.py). Those
  # tests start a real confined process and skip everywhere but Windows,
  # so this is the one place they run. They fail rather than skip when
  # the sandbox cannot be set up here, and a skip naming AppContainer
  # fails the job, so it cannot go green having run nothing it exists for.
  sandbox-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Sandbox tests under a real AppContainer
        shell: pwsh
        run: |
          uv run --no-sync pytest tests/test_an_extension_process_is_confined_on_windows.py -q -rs -s 2>&1 | Tee-Object -FilePath sandbox.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path sandbox.log -Pattern "SKIPPED.*AppContainer" -Quiet) {
            Write-Error "A Windows sandbox test skipped on a Windows runner"
            exit 1
          }
